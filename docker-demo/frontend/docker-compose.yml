services:
  backend:
    image: nxttrendz-backend:latest
    build: ../backend
    environment:
      APP_ENV: development
    volumes:
      - db_data:/app/data

  frontend:
    image: nxttrendz-frontend:latest
    build: .
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  db_data: